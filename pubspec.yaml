name: eateries
description: Eateries food delivery UI, implemented from the Pixso Light and Dark design pages.
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
        - asset: assets/fonts/Manrope.ttf
          weight: 800
